plugins {
    id "com.android.application"
}

android {
    namespace "com.pcc.projectcommandcenter"
    compileSdk 35

    defaultConfig {
        applicationId "com.pcc.projectcommandcenter"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.12.1"
}
