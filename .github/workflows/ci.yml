name: CI

on:
  push:
    branches: ["main", "feat/**", "audit/**"]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate UI standard
        run: npm run ui:standard

      - name: Validate PowerShell smoke syntax
        shell: pwsh
        run: |
          $scripts = @(
            "../scripts/RUN_PCC_SMOKE.ps1",
            "../scripts/FULL_SMOKE_POWERSHELL.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              exit 1
            }
          }

      - name: Enforce pwsh-only smoke runtime
        shell: pwsh
        run: |
          $scripts = @(
            "../scripts/RUN_PCC_SMOKE.ps1",
            "../scripts/FULL_SMOKE_POWERSHELL.ps1"
          )
          $legacyRefs = Select-String -Path $scripts -Pattern "powershell\.exe" -SimpleMatch:$false
          if ($legacyRefs) {
            $legacyRefs | ForEach-Object { Write-Error "Legacy Windows PowerShell reference found: $($_.Path):$($_.LineNumber) $($_.Line)" }
            exit 1
          }

      - name: Validate smoke single-flight and release lock
        shell: pwsh
        run: |
          $launcher = Get-Content "../scripts/RUN_PCC_SMOKE.ps1" -Raw
          $fullSmoke = Get-Content "../scripts/FULL_SMOKE_POWERSHELL.ps1" -Raw

          $requiredLauncher = @(
            "PCC_Project_Command_Center_Smoke",
            "WaitOne(0",
            "ExpectedReleaseCommit",
            "Stop-RepoLocalNodeProcesses"
          )

          foreach ($token in $requiredLauncher) {
            if (-not $launcher.Contains($token)) {
              Write-Error "Missing smoke launcher concurrency guardrail: $token"
              exit 1
            }
          }

          $requiredFullSmoke = @(
            "ExpectedReleaseCommit",
            "Assert-ReleaseUnchanged",
            "Release changed during validation",
            "post-CI",
            "pre-authenticated-data",
            "final"
          )

          foreach ($token in $requiredFullSmoke) {
            if (-not $fullSmoke.Contains($token)) {
              Write-Error "Missing immutable-release smoke guardrail: $token"
              exit 1
            }
          }

      - name: Validate isolated smoke worktree
        shell: pwsh
        run: |
          $fullSmoke = Get-Content "../scripts/FULL_SMOKE_POWERSHELL.ps1" -Raw

          $requiredIsolation = @(
            "Invoke-IsolatedNpmCi",
            "New-IsolatedValidationWorktree",
            "worktree add --detach",
            "PCC_SMOKE",
            "partial worktree will not be repaired or reused",
            "CI validation isolated from operator working copy"
          )

          foreach ($token in $requiredIsolation) {
            if (-not $fullSmoke.Contains($token)) {
              Write-Error "Missing isolated npm smoke guardrail: $token"
              exit 1
            }
          }

          $forbiddenLegacy = @(
            "Invoke-NpmCiWithWindowsRetry",
            'Remove-Item $nodeModules'
          )

          foreach ($token in $forbiddenLegacy) {
            if ($fullSmoke.Contains($token)) {
              Write-Error "Legacy in-place node_modules recovery returned: $token"
              exit 1
            }
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
