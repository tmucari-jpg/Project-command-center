name: CI

on:
  push:
    branches: ["main", "feat/**", "audit/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate UI standard
        run: npm run ui:standard

      - name: Validate PCC icon assets
        run: npm run icons:validate

      - name: Validate PowerShell smoke syntax
        shell: pwsh
        run: |
          $scripts = @(
            "../scripts/RUN_PCC_SMOKE.ps1",
            "../scripts/FULL_SMOKE_POWERSHELL.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              exit 1
            }
          }

