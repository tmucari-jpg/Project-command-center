      - name: Validate commercial master, consulting model and offline coverage
        shell: pwsh
        run: |
          $master = Get-Content "./app/(protected)/commercial-master/page.tsx" -Raw
          $sidebar = Get-Content "./components/sidebar.tsx" -Raw
          $admin = Get-Content "./app/(protected)/admin/page.tsx" -Raw
          $monetization = Get-Content "./app/(protected)/monetization/page.tsx" -Raw
          $briefingMonetization = Get-Content "./app/(protected)/monetization/briefing-diario/page.tsx" -Raw
          $deliverables = Get-Content "./app/(protected)/deliverables/page.tsx" -Raw
          $workstreamMigration = Get-Content "../supabase/migrations/20261022154500_deliverable_workstreams.sql" -Raw
          $masterExport = Get-Content "./app/api/exports/commercial-master/route.ts" -Raw
          $documentStandards = Get-Content "./lib/project-document-standards.ts" -Raw
          $offlineBootstrap = Get-Content "./app/api/offline/bootstrap/route.ts" -Raw
          $offlineClient = Get-Content "./lib/offline-client.ts" -Raw
          $offlineApp = Get-Content "./public/offline-app.js" -Raw
          $smoke = Get-Content "../scripts/FULL_SMOKE_POWERSHELL.ps1" -Raw
          $vercel = Get-Content "./vercel.json" -Raw

          foreach ($token in @(
            "O PCC funciona como consultor de projectos",
            "Personalizado · Agregado · Integrado",
            "Pacotes e preços",
            "Custos associados",
            "Base de entregáveis da consultoria",
            "Avaliar",
            "Decidir",
            "Estruturar",
            "Acompanhar",
            "Comprovar valor"
          )) {
            if (-not $master.Contains($token)) {
              Write-Error "Commercial master is missing required content: $token"
              exit 1
            }
          }

          foreach ($token in @("/monetization", "Comercial", "Backlog, pipeline, leads")) {
            if (-not $admin.Contains($token)) {
              Write-Error "Commercial administration navigation is missing: $token"
              exit 1
            }
          }

          if ($admin.Contains('href: "/commercial-master"')) {
            Write-Error "Master Comercial must be a project deliverable, not a separate Administration module."
            exit 1
          }

          foreach ($token in @("/commercial-master", "/monetization")) {
            if ($sidebar.Contains($token)) {
              Write-Error "Commercial area must not appear in primary navigation: $token"
              exit 1
            }
          }

          foreach ($page in @($master, $monetization, $briefingMonetization)) {
            if (-not $page.Contains("requireAdmin")) {
              Write-Error "Commercial routes must require administrator access."
              exit 1
            }
          }

          foreach ($token in @("project_strategy_execution_plans", "project_commercial_profiles", "financial_entries", "commercial_leads")) {
            if (-not $offlineBootstrap.Contains($token)) {
              Write-Error "Offline commercial snapshot is missing source: $token"
              exit 1
            }
          }

          foreach ($token in @("strategyPlans", "commercialProfiles", "financialEntries", "commercialLeads")) {
            if (-not $offlineClient.Contains($token) -and -not $offlineApp.Contains($token)) {
              Write-Error "Offline commercial snapshot support is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("/commercial-master", "/monetization")) {
            if ($offlineClient.Contains($token)) {
              Write-Error "Protected commercial pages must not be cached as offline HTML: $token"
              exit 1
            }
          }

          foreach ($token in @("Backlog comercial", "Pipeline", "Novo entregável comercial", "Entregáveis comerciais")) {
            if (-not $monetization.Contains($token)) {
              Write-Error "Transversal Commercial workspace is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("commercial", "financial", "operational", "governance", "technical")) {
            if (-not $workstreamMigration.Contains($token)) {
              Write-Error "Deliverable workstream taxonomy is missing: $token"
              exit 1
            }
          }

          # A Biblioteca do Projecto não é um arquivo central de vertentes.
          # O único entregável visível no projecto é o Diagnóstico do Cliente, gerado automaticamente.

          foreach ($token in @("PCC_Snapshot_Operacional_Comercial.doc", "application/msword", "Marketing, Vendas e Lançamento do PCC")) {
            if (-not $masterExport.Contains($token)) {
              Write-Error "Commercial operational snapshot is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("master_mind", "commercial_guide", "Master Mind", "Guia Comercial", "identidade visual", "controlo de versão")) {
            if (-not $documentStandards.Contains($token) -and -not $deliverables.Contains($token)) {
              Write-Error "PCC document standard is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("PCC mobile icon 192", "PCC mobile icon 512", "PCC maskable icon", "/commercial-master", "Master Comercial export rejects anonymous access")) {
            if (-not $smoke.Contains($token)) {
              Write-Error "Smoke coverage is missing: $token"
              exit 1
            }
          }

          if (-not $vercel.Contains('"audit/commercial-master-20261022": false')) {
            Write-Error "Commercial audit branch must not trigger a Vercel preview deployment."
            exit 1
          }

      - name: Validate commitment, acceptance and safe closure
        shell: pwsh
        run: |
          $migration = Get-Content "../supabase/migrations/20261023152000_commitment_acceptance_and_safe_closure.sql" -Raw
          $mutations = Get-Content "./app/(protected)/mutations.ts" -Raw
          $project = Get-Content -LiteralPath "./app/(protected)/projects/[id]/page.tsx" -Raw
          $deliverables = Get-Content "./app/(protected)/deliverables/page.tsx" -Raw
          $objectives = Get-Content "./app/(protected)/objectives/page.tsx" -Raw
          $commercial = Get-Content "./app/(protected)/monetization/page.tsx" -Raw
          $vercel = Get-Content "./vercel.json" -Raw
          $offlineBootstrap = Get-Content "./app/api/offline/bootstrap/route.ts" -Raw
          $offlineClient = Get-Content "./lib/offline-client.ts" -Raw
          $serviceWorker = Get-Content "./public/sw.js" -Raw

          foreach ($token in @(
            "project_commitment_baselines",
            "project_change_requests",
            "client_validation_reference",
            "qa_status",
            "acceptance_status",
            "cost_treatment",
            "value_status",
            "handover_status",
            "continuity_status",
            "information_classification",
            "enforce_project_execution_commitment"
          )) {
            if (-not $migration.Contains($token)) {
              Write-Error "Missing PCC commitment/safe-closure database guard: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "saveCommitmentBaseline",
            "approveCommitmentInternally",
            "validateCommitmentByClient",
            "createProjectChangeRequest",
            "recordDeliverableQA",
            "recordDeliverableAcceptance",
            "updateProjectOutcomeStatus"
          )) {
            if (-not $mutations.Contains($token)) {
              Write-Error "Missing PCC commitment workflow action: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "Compromisso de Entrega",
            "Registar validação e autorizar execução",
            "Alterações de âmbito",
            "O progresso principal é determinado pelos entregáveis aceites",
            "Próxima decisão / acção"
          )) {
            if (-not $project.Contains($token)) {
              Write-Error "Project detail is missing protected commitment UI: $token"
              exit 1
            }
          }

          $closure = Get-Content "./app/(protected)/closure/page.tsx" -Raw
          foreach ($token in @(
            "Processo independente do entregável",
            "Cliente não pretende continuar",
            "Não é necessário existir entregável concluído"
          )) {
            if (-not $closure.Contains($token)) {
              Write-Error "Independent project closure UI is missing: $token"
              exit 1
            }
          }

          if ($objectives.Contains("Cada projecto aprovado deve ter")) {
            Write-Error "Legacy objective explanatory card returned."
            exit 1
          }

          foreach ($token in @("Contacto", "Interesse", "Diagnóstico", "Demonstração", "Proposta", "Cliente", "Handoff")) {
            if (-not $commercial.Contains($token)) {
              Write-Error "Validated commercial pipeline is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "confidential",
            "restricted",
            "allowedProjectIds",
            "safeProjectRows"
          )) {
            if (-not $offlineBootstrap.Contains($token)) {
              Write-Error "Sensitive-project offline filter is missing: $token"
              exit 1
            }
          }

          if (-not $serviceWorker.Contains('if (event.request.mode === "navigate")') -or -not $serviceWorker.Contains("fetch(event.request).catch(async () => {")) {
            Write-Error "Protected navigations must fall back to the offline shell without persisting authenticated HTML."
            exit 1
          }

          if (-not $offlineClient.Contains("caches.delete(OFFLINE_ROUTE_CACHE)")) {
            Write-Error "Logout/offline cleanup must remove the protected route cache."
            exit 1
          }

          if (-not $vercel.Contains('"audit/pcc-final-consolidation-20261023": false')) {
            Write-Error "Final consolidation branch must not trigger a Vercel preview deployment."
            exit 1
          }

      - name: Validate operational health and official document guards
        shell: pwsh
        run: |
          $health = Get-Content "./lib/ai-provider-health.ts" -Raw
          $assist = Get-Content "./lib/ai-assist-router.ts" -Raw
          $botProvider = Get-Content "./lib/bot-ia-provider.ts" -Raw
          $aiPage = Get-Content "./app/(protected)/ai-providers/page.tsx" -Raw
          $optimization = Get-Content "./app/(protected)/optimization/page.tsx" -Raw
          $readiness = Get-Content "./components/operational-readiness-check.tsx" -Raw
          $officialPage = Get-Content "./app/(protected)/official-documents/page.tsx" -Raw
          $upload = Get-Content "./app/api/official-documents/upload/route.ts" -Raw
          $download = Get-Content -LiteralPath "./app/api/official-documents/[id]/download/route.ts" -Raw
          $migrationHealth = Get-Content "../supabase/migrations/20261026060301_operational_health_and_missing_indexes.sql" -Raw
          $migrationDocuments = Get-Content "../supabase/migrations/20261026060857_official_documents_and_operational_validation.sql" -Raw
          $localAI = Get-Content "./lib/browser-local-ai.ts" -Raw
          $botOperator = Get-Content "./components/bot-ia-operator.tsx" -Raw
          $botActions = Get-Content "./app/(protected)/bot-ia/actions.ts" -Raw
          $mobile = Get-Content "./app/(protected)/mobile/page.tsx" -Raw
          $security = Get-Content "./app/(protected)/security/page.tsx" -Raw
          $migrationAI = Get-Content "../supabase/migrations/20261026070623_ai_configuration_mobile_and_diagnostic_rate_limit.sql" -Raw
          $migrationRate = Get-Content "../supabase/migrations/20261026082141_client_diagnostic_rate_limit_observability.sql" -Raw

          foreach ($token in @("reasoning_effort", "max_completion_tokens", "last_health_message")) {
            if (-not $health.Contains($token) -and -not $assist.Contains($token) -and -not $botProvider.Contains($token)) {
              Write-Error "Missing GPT-6 operational compatibility guard: $token"
              exit 1
            }
          }

          foreach ($token in @("Validar todos agora", "Diagnóstico:", "operational_validation_runs")) {
            if (-not $aiPage.Contains($token) -and -not $optimization.Contains($token)) {
              Write-Error "Missing AI operational evidence UI: $token"
              exit 1
            }
          }

          foreach ($token in @("Service Worker", "Persistência local", "end_to_end_offline_sync_validated")) {
            if (-not $readiness.Contains($token)) {
              Write-Error "Missing offline device readiness guard: $token"
              exit 1
            }
          }

          foreach ($token in @(
            'scope", "release"',
            'releaseValidation.status !== "passed"',
            "A versão oficial só pode ser promovida depois de a release actual estar validada operacionalmente em pleno."
          )) {
            if (-not $upload.Contains($token)) {
              Write-Error "Missing full-operation release gate for official documents: $token"
              exit 1
            }
          }

          foreach ($token in @("download", "/api/official-documents/")) {
            if (-not $officialPage.Contains($token)) {
              Write-Error "Missing mobile/desktop download hint in official documents: $token"
              exit 1
            }
          }

          foreach ($token in @("Repositório Oficial PCC", "pcc-official-documents", "não depende de nenhum entregável de projecto")) {
            if (-not $officialPage.Contains($token) -and -not $upload.Contains($token) -and -not $download.Contains($token)) {
              Write-Error "Missing independent PCC official repository guard: $token"
              exit 1
            }
          }

          if ($upload.Contains("Uma versão oficial actual deve estar ligada a um entregável")) {
            Write-Error "Official repository must not depend on a project deliverable."
            exit 1
          }

          foreach ($token in @("SmolLM2-360M-Instruct-q4f16_1-MLC", "WebGPU", "sem quota")) {
            if (-not $localAI.Contains($token)) {
              Write-Error "Missing browser-local BotIA fallback: $token"
              exit 1
            }
          }

          foreach ($token in @("persistLocalBotIARun", "localFallback", "IA Local PCC")) {
            if (-not $botActions.Contains($token) -and -not $botOperator.Contains($token)) {
              Write-Error "Missing BotIA local E2E integration: $token"
              exit 1
            }
          }

          foreach ($token in @("Android APK", "Android AAB", "PWA")) {
            if (-not $mobile.Contains($token)) {
              Write-Error "Missing mobile distribution surface: $token"
              exit 1
            }
          }

          foreach ($token in @("60 consultas/10 min", "8 tentativas de envio/15 min", "client_diagnostic_rate_limit_summary")) {
            if (-not $security.Contains($token) -and -not $migrationRate.Contains($token)) {
              Write-Error "Missing diagnostic rate-limit observability: $token"
              exit 1
            }
          }

          foreach ($token in @("configuration_status", "availability_reason", "android_apk", "android_aab", "consume_client_diagnostic_rate_limit")) {
            if (-not $migrationAI.Contains($token)) {
              Write-Error "Missing AI/mobile/rate-limit schema guard: $token"
              exit 1
            }
          }

          foreach ($token in @("last_health_message", "idx_project_change_requests_user_id", "idx_project_commitment_baselines_user_id")) {
            if (-not $migrationHealth.Contains($token)) {
              Write-Error "Missing operational-health migration token: $token"
              exit 1
            }
          }

          foreach ($token in @("pcc_official_documents", "operational_validation_runs", "pcc-official-documents")) {
            if (-not $migrationDocuments.Contains($token)) {
              Write-Error "Missing official-document migration token: $token"
              exit 1
            }
          }

      - name: Validate client project status portal
        shell: pwsh
        run: |
          $migration = Get-Content "../supabase/migrations/20261026143000_client_project_status_portal.sql" -Raw
          $project = Get-Content -LiteralPath "./app/(protected)/projects/[id]/page.tsx" -Raw
          $publicPage = Get-Content -LiteralPath "./app/project-status/[token]/page.tsx" -Raw
          $publicActions = Get-Content -LiteralPath "./app/project-status/[token]/actions.ts" -Raw
          $proxy = Get-Content "./lib/supabase/proxy.ts" -Raw
          $vercel = Get-Content "./vercel.json" -Raw
          $mutations = Get-Content "./app/(protected)/mutations.ts" -Raw

          foreach ($token in @(
            "project_client_status_snapshots",
            "project_client_status_links",
            "project_client_status_decisions",
            "consume_project_client_status_rate_limit",
            "project_client_status_lookup",
            "project_client_status_submit",
            "enable row level security",
            "revoke all on table public.project_client_status_snapshots from anon"
          )) {
            if (-not $migration.Contains($token)) {
              Write-Error "Client status portal migration is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "publishProjectClientStatus",
            "projectClientStatusPublicUrl",
            "project_client_status_snapshots",
            "project_client_status_links"
          )) {
            if (-not $mutations.Contains($token)) {
              Write-Error "Client status publication flow is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "Partilhar Status & Next Actions com o cliente",
            "ProjectClientStatusLink"
          )) {
            if (-not $project.Contains($token)) {
              Write-Error "Project status publication UI is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "Status & Next Actions",
            "Entregáveis",
            "KPI / Resultado",
            "Aprovar próximos passos",
            "Solicitar alteração",
            "Pedir esclarecimento",
            "project_client_status_lookup"
          )) {
            if (-not $publicPage.Contains($token)) {
              Write-Error "Public client status portal is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "project_client_status_submit",
            "hashProjectClientStatusToken"
          )) {
            if (-not $publicActions.Contains($token)) {
              Write-Error "Client status decision submission is missing: $token"
              exit 1
            }
          }

          if (-not $proxy.Contains('"/project-status"')) {
            Write-Error "Project status portal must be an isolated public path."
            exit 1
          }

          foreach ($token in @(
            '"/project-status/(.*)"',
            '"no-store, max-age=0"',
            '"noindex, nofollow, noarchive"',
            '"no-referrer"',
            '"DENY"',
            "frame-ancestors 'none'"
          )) {
            if (-not $vercel.Contains($token)) {
              Write-Error "Project status security header is missing: $token"
              exit 1
            }
          }

          if ($publicPage.Contains('from("projects")') -or $publicPage.Contains('from("deliverables")')) {
            Write-Error "Public client status page must not read internal project tables directly."
            exit 1
          }

