name: CI

on:
  push:
    branches: ["main", "feat/**", "audit/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: application

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate UI standard
        run: npm run ui:standard

      - name: Validate PowerShell smoke syntax
        shell: pwsh
        run: |
          $scripts = @(
            "../scripts/RUN_PCC_SMOKE.ps1",
            "../scripts/FULL_SMOKE_POWERSHELL.ps1"
          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${script}: $($_.Message)" }
              exit 1
            }
          }

      - name: Enforce pwsh-only smoke runtime
        shell: pwsh
        run: |
          $scripts = @(
            "../scripts/RUN_PCC_SMOKE.ps1",
            "../scripts/FULL_SMOKE_POWERSHELL.ps1"
          )
          $legacyRefs = Select-String -Path $scripts -Pattern "powershell\.exe" -SimpleMatch:$false
          if ($legacyRefs) {
            $legacyRefs | ForEach-Object { Write-Error "Legacy Windows PowerShell reference found: $($_.Path):$($_.LineNumber) $($_.Line)" }
            exit 1
          }

      - name: Validate smoke single-flight and release lock
        shell: pwsh
        run: |
          $launcher = Get-Content "../scripts/RUN_PCC_SMOKE.ps1" -Raw
          $fullSmoke = Get-Content "../scripts/FULL_SMOKE_POWERSHELL.ps1" -Raw

          $requiredLauncher = @(
            "PCC_Project_Command_Center_Smoke",
            "WaitOne(0",
            "ExpectedReleaseCommit",
            "Stop-RepoLocalNodeProcesses"
          )

          foreach ($token in $requiredLauncher) {
            if (-not $launcher.Contains($token)) {
              Write-Error "Missing smoke launcher concurrency guardrail: $token"
              exit 1
            }
          }

          $requiredFullSmoke = @(
            "ExpectedReleaseCommit",
            "Assert-ReleaseUnchanged",
            "Release changed during validation",
            "post-CI",
            "pre-authenticated-data",
            "final"
          )

          foreach ($token in $requiredFullSmoke) {
            if (-not $fullSmoke.Contains($token)) {
              Write-Error "Missing immutable-release smoke guardrail: $token"
              exit 1
            }
          }

      - name: Validate isolated smoke worktree
        shell: pwsh
        run: |
          $fullSmoke = Get-Content "../scripts/FULL_SMOKE_POWERSHELL.ps1" -Raw

          $requiredIsolation = @(
            "Invoke-IsolatedNpmCi",
            "New-IsolatedValidationWorktree",
            "worktree add --detach",
            "PCC_SMOKE",
            "partial worktree will not be repaired or reused",
            "CI validation isolated from operator working copy"
          )

          foreach ($token in $requiredIsolation) {
            if (-not $fullSmoke.Contains($token)) {
              Write-Error "Missing isolated npm smoke guardrail: $token"
              exit 1
            }
          }

          $forbiddenLegacy = @(
            "Invoke-NpmCiWithWindowsRetry",
            'Remove-Item $nodeModules'
          )

          foreach ($token in $forbiddenLegacy) {
            if ($fullSmoke.Contains($token)) {
              Write-Error "Legacy in-place node_modules recovery returned: $token"
              exit 1
            }
          }

      - name: Validate API auth and worktree cleanup guards
        shell: pwsh
        run: |
          $rootProxy = Get-Content "../application/proxy.ts" -Raw
          $smoke = Get-Content "../scripts/FULL_SMOKE_POWERSHELL.ps1" -Raw

          if (-not $rootProxy.Contains("((?!api|_next/static")) {
            Write-Error "API routes must be excluded from Next proxy so route handlers own API authentication."
            exit 1
          }

          if (-not $smoke.Contains("Stop-ProcessesForPath")) {
            Write-Error "Missing isolated worktree process-tree cleanup."
            exit 1
          }

      - name: Validate stale runtime and port ownership guards
        shell: pwsh
        run: |
          $launcher = Get-Content "../scripts/RUN_PCC_SMOKE.ps1" -Raw
          $smoke = Get-Content "../scripts/FULL_SMOKE_POWERSHELL.ps1" -Raw

          foreach ($token in @("PCC_SMOKE", "PCC repository/temp Node processes cleared")) {
            if (-not $launcher.Contains($token)) {
              Write-Error "Missing stale temp runtime launcher guard: $token"
              exit 1
            }
          }

          foreach ($token in @("Clear-SmokePort", "Get-NetTCPConnection", "Current runtime process exited before readiness")) {
            if (-not $smoke.Contains($token)) {
              Write-Error "Missing runtime ownership smoke guard: $token"
              exit 1
            }
          }

      - name: Validate authenticated REST row normalization
        shell: pwsh
        run: |
          $smoke = Get-Content "../scripts/FULL_SMOKE_POWERSHELL.ps1" -Raw

          foreach ($token in @(
            "ConvertTo-RestRows",
            "Project RLS read returned",
            "Project titles visible to operator"
          )) {
            if (-not $smoke.Contains($token)) {
              Write-Error "Missing authenticated REST smoke diagnostic/normalization guard: $token"
              exit 1
            }
          }

      - name: Validate BotIA-aligned OpenAI health check
        shell: pwsh
        run: |
          $health = Get-Content "../application/lib/ai-provider-health.ts" -Raw
          foreach ($token in @(
            "/chat/completions",
            "mesmo endpoint usado pelo BotIA",
            "providerMessage"
          )) {
            if (-not $health.Contains($token)) {
              Write-Error "Missing BotIA-aligned OpenAI health guard: $token"
              exit 1
            }
          }

      - name: Validate BotIA provider failover guards
        shell: pwsh
        run: |
          $actions = Get-Content "../application/app/(protected)/bot-ia/actions.ts" -Raw
          $provider = Get-Content "../application/lib/bot-ia-provider.ts" -Raw
          $health = Get-Content "../application/lib/ai-provider-health.ts" -Raw

          foreach ($token in @(
            "resolveBotIAProviders",
            "generateBotIAPlanWithFallback",
            "provider_attempts",
            'last_health_status: "degraded"'
          )) {
            if (-not $actions.Contains($token) -and -not $provider.Contains($token)) {
              Write-Error "Missing BotIA failover guard: $token"
              exit 1
            }
          }

          if ($provider.Contains("dashscope-intl.aliyuncs.com/compatible-mode/v1")) {
            Write-Error "Legacy generic Qwen endpoint must not be used; configure an explicit Workspace/Region endpoint."
            exit 1
          }

          if (-not $health.Contains("Workspace/Região")) {
            Write-Error "Qwen Cloud health check must require explicit Workspace/Region configuration."
            exit 1
          }

      - name: Validate consolidated PCC workflow
        shell: pwsh
        run: |
          $sidebar = Get-Content "../application/components/sidebar.tsx" -Raw
          $mutations = Get-Content "../application/app/(protected)/mutations.ts" -Raw
          $deliverables = Get-Content "../application/app/(protected)/deliverables/page.tsx" -Raw

          foreach ($legacy in @("/agenda", "/focus", "/blockers", "/decisions")) {
            if ($sidebar.Contains($legacy)) {
              Write-Error "Legacy operational drawer returned to sidebar: $legacy"
              exit 1
            }
          }

          foreach ($token in @(
            "finalizeProjectClosure",
            "Entregável entregue está bloqueado",
            "Todos os entregáveis precisam de evidência",
            "Entregáveis & Fecho"
          )) {
            if (-not $mutations.Contains($token) -and -not $deliverables.Contains($token)) {
              Write-Error "Missing consolidated PCC closure guard: $token"
              exit 1
            }
          }

      - name: Validate immutable deliverable archives
        shell: pwsh
        run: |
          $migration = Get-Content "../supabase/migrations/20261021114500_immutable_deliverable_archives.sql" -Raw
          $deliverables = Get-Content "../application/app/(protected)/deliverables/page.tsx" -Raw
          $mutations = Get-Content "../application/app/(protected)/mutations.ts" -Raw

          foreach ($token in @(
            "protect_final_deliverable_archive",
            "protect_locked_deliverable_evidence",
            "supersedes_deliverable_id",
            "artifact_reference",
            "locked_at"
          )) {
            if (-not $migration.Contains($token)) {
              Write-Error "Missing immutable archive database guard: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "Registo oficial imutável",
            "Criar nova versão",
            "referência imutável"
          )) {
            if (-not $deliverables.Contains($token) -and -not $mutations.Contains($token)) {
              Write-Error "Missing immutable archive application guard: $token"
              exit 1
            }
          }

      - name: Validate consolidated PCC diagnostic upgrades
        shell: pwsh
        run: |
          $offlineBootstrap = Get-Content "./app/api/offline/bootstrap/route.ts" -Raw
          $offlineSync = Get-Content "./app/api/offline/sync/route.ts" -Raw
          $offlinePage = Get-Content "./public/offline.html" -Raw
          $offlineApp = Get-Content "./public/offline-app.js" -Raw
          $factory = Get-Content "./app/(protected)/project-factory/page.tsx" -Raw
          $charts = Get-Content "./components/operational-charts.tsx" -Raw
          $globals = Get-Content "./app/globals.css" -Raw
          $manifest = Get-Content "./app/manifest.ts" -Raw
          $layout = Get-Content "./app/layout.tsx" -Raw
          $vercel = Get-Content "./vercel.json" -Raw
          $offlineBootstrap = Get-Content "./app/api/offline/bootstrap/route.ts" -Raw
          $offlineClient = Get-Content "./lib/offline-client.ts" -Raw
          $serviceWorker = Get-Content "./public/sw.js" -Raw

          foreach ($token in @(
            '"objectives"',
            '"metrics"',
            '"project_factory_cases"',
            '"project_governance_dependencies"',
            '"project_governance_risks"',
            '"decisions"'
          )) {
            if (-not $offlineBootstrap.Contains($token)) {
              Write-Error "Offline snapshot is missing PCC area: $token"
              exit 1
            }
          }

          foreach ($token in @("create_factory_intake", "project_gate_events")) {
            if (-not $offlineSync.Contains($token)) {
              Write-Error "Offline sync is missing project intake guard: $token"
              exit 1
            }
          }

          foreach ($token in @("Modo offline completo", "Projectos", "Executar", "Objectivos", "Entregáveis", "Métricas", "Evidências", "Factory", "Governança")) {
            if (-not $offlinePage.Contains($token) -and -not $offlineApp.Contains($token)) {
              Write-Error "Offline workspace is missing navigation/content: $token"
              exit 1
            }
          }

          $adaptiveIntake = Get-Content "./components/adaptive-project-intake.tsx" -Raw
          $assistRoute = Get-Content "./app/api/ai/assist/route.ts" -Raw
          $assistRouter = Get-Content "./lib/ai-assist-router.ts" -Raw

          foreach ($token in @("AdaptiveProjectIntake", "Defina o ponto de partida")) {
            if (-not $factory.Contains($token)) {
              Write-Error "Adaptive project intake is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("O que pretende fazer?", "client_request", "investment", "internal_improvement", "digital_solution", "Iniciar avaliação G1/G2")) {
            if (-not $adaptiveIntake.Contains($token)) {
              Write-Error "Adaptive project questions are missing: $token"
              exit 1
            }
          }

          foreach ($token in @("generateAssistWithFallback", 'fallback: "deterministic"')) {
            if (-not $assistRoute.Contains($token)) {
              Write-Error "Central AI assist route is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("ai_provider_profiles", '.eq("mode", "cloud")', "validateAIProviderHealth", "QWEN_API_KEY", "OPENAI_API_KEY")) {
            if (-not $assistRouter.Contains($token)) {
              Write-Error "AI provider router is missing: $token"
              exit 1
            }
          }

          if ($adaptiveIntake.Contains("127.0.0.1") -or $assistRoute.Contains("127.0.0.1") -or $assistRouter.Contains("127.0.0.1")) {
            Write-Error "Mobile project intake must not depend on localhost AI."
            exit 1
          }

          foreach ($token in @(
            "4. Geografia / mercados onde pode operar",
            "5. Sectores de interesse, se existirem",
            "7. Nível de envolvimento pretendido no negócio",
            "geographyOptions",
            "sectorOptions",
            "involvementOptions",
            "Outro sector / detalhes",
            "Outro mercado / detalhes"
          )) {
            if (-not $adaptiveIntake.Contains($token)) {
              Write-Error "Adaptive investment multi-select diagnostic is missing: $token"
              exit 1
            }
          }

          $investmentPanel = Get-Content "./components/investment-discovery-panel.tsx" -Raw
          $investmentModel = Get-Content "./lib/investment-discovery.ts" -Raw
          $factoryCasePage = Get-Content -LiteralPath "./app/(protected)/project-factory/[id]/page.tsx" -Raw
          $mutations = Get-Content "./app/(protected)/mutations.ts" -Raw
          $investmentExport = Get-Content -LiteralPath "./app/api/exports/investment-brief/[id]/route.ts" -Raw
          $investmentMigration = Get-Content "../supabase/migrations/20261024140500_investment_discovery_briefs.sql" -Raw

          foreach ($token in @(
            "Gerar propostas para decisão",
            "context_involvement",
            "context_return_objective"
          )) {
            if (-not $adaptiveIntake.Contains($token)) {
              Write-Error "Investment discovery intake is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "Resumo para decisão",
            "Oportunidades de investimento",
            "Seleccionar e seguir para validação",
            "/api/exports/investment-brief/"
          )) {
            if (-not $investmentPanel.Contains($token)) {
              Write-Error "Investment decision brief is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "parseInvestmentDiscoveryBrief",
            "investmentDiscoveryInstructions",
            "recommended_option_id",
            "validation_strategy",
            "entry_strategy"
          )) {
            if (-not $investmentModel.Contains($token)) {
              Write-Error "Investment discovery model is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "buildInvestmentDiscoveryBrief",
            "selectInvestmentDiscoveryOption",
            'source: "investment_selected"',
            'stage: "competitive_intelligence"'
          )) {
            if (-not $mutations.Contains($token)) {
              Write-Error "Investment single-line decision flow is missing: $token"
              exit 1
            }
          }

          if (-not $factoryCasePage.Contains("InvestmentDiscoveryPanel")) {
            Write-Error "Factory case must render the investment decision brief before normal validation."
            exit 1
          }

          foreach ($token in @("PCC_Resumo_Decisao_Investimento.doc", "application/msword")) {
            if (-not $investmentExport.Contains($token)) {
              Write-Error "Investment decision document export is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "investment_discovery_briefs",
            "selected_option_id",
            "recommended_option_id",
            "enable row level security"
          )) {
            if (-not $investmentMigration.Contains($token)) {
              Write-Error "Investment discovery migration is missing: $token"
              exit 1
            }
          }

          $clientDiagnosticPublic = Get-Content -LiteralPath "./app/client-diagnostic/[token]/page.tsx" -Raw
          $clientDiagnosticQuestionnaire = Get-Content "./components/client-diagnostic-questionnaire.tsx" -Raw
          $clientDiagnosticPanel = Get-Content "./components/client-diagnostic-panel.tsx" -Raw
          $clientDiagnosticGenerator = Get-Content "./components/client-diagnostic-link-generator.tsx" -Raw
          $clientDiagnosticTracker = Get-Content "./components/client-diagnostic-tracker.tsx" -Raw
          $clientDiagnosticMigration = Get-Content "../supabase/migrations/20261024193000_client_diagnostic_questionnaire.sql" -Raw
          $clientDiagnosticExternalMigration = Get-Content "../supabase/migrations/20261024203000_client_diagnostic_external_sources.sql" -Raw

          foreach ($token in @(
            "/brand/pcc-logo.png",
            "Avalie. Decida. Execute.",
            "Da Estratégia à Execução",
            "Diagnóstico inicial",
            "Validade",
            "7 dias",
            "O que o trouxe até nós?",
            "investment_discovery",
            "AdaptiveContext",
            "AdaptiveFocus",
            "Enviar e preparar o diagnóstico"
          )) {
            if (-not $clientDiagnosticQuestionnaire.Contains($token)) {
              Write-Error "Executive adaptive client questionnaire is missing: $token"
              exit 1
            }
          }

          if (-not $clientDiagnosticPublic.Contains("ClientDiagnosticQuestionnaire")) {
            Write-Error "Public client diagnostic route must render the executive questionnaire."
            exit 1
          }

          foreach ($token in @(
            "Informação declarada pelo cliente",
            "Incorporar no diagnóstico",
            "Pedir esclarecimento",
            "Informação ainda em falta",
            "Pontos a confirmar"
          )) {
            if (-not $clientDiagnosticPanel.Contains($token)) {
              Write-Error "Internal client diagnostic review is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "Validade do questionário: 7 dias",
            "Copiar link",
            "createClientDiagnosticRequest"
          )) {
            if (-not $clientDiagnosticGenerator.Contains($token)) {
              Write-Error "Client diagnostic secure link generator is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "createClientDiagnosticRequest",
            "reviewClientDiagnosticResponse",
            "incorporateClientDiagnosticResponse",
            "importClientDiagnosticLink",
            "uploadClientDiagnosticFile",
            "INFORMAÇÃO DECLARADA PELO CLIENTE",
            "executive-v3"
          )) {
            if (-not $mutations.Contains($token)) {
              Write-Error "Client diagnostic workflow action is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "client_diagnostic_requests",
            "client_diagnostic_responses",
            "client_diagnostic_reviews",
            "token_hash",
            "security definer",
            "revoke all on function public.client_diagnostic_lookup",
            "grant execute on function public.client_diagnostic_lookup",
            "enable row level security",
            "revoke all on table public.client_diagnostic_requests from anon"
          )) {
            if (-not $clientDiagnosticMigration.Contains($token)) {
              Write-Error "Client diagnostic security/data guard is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("conic-gradient", "PressureBar", "PressureLegend")) {
            if (-not $charts.Contains($token)) {
              Write-Error "Operational chart system is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("--cc-blocked", "--cc-overdue", "--cc-due-soon", "--cc-in-progress")) {
            if (-not $globals.Contains($token)) {
              Write-Error "Semantic status colour is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("/icons/icon-192.png", "/icons/icon-512.png", "/icons/icon-maskable-512.png")) {
            if (-not $manifest.Contains($token)) {
              Write-Error "PWA manifest icon is missing: $token"
              exit 1
            }
          }

          if (-not $layout.Contains("/icons/apple-touch-icon.png")) {
            Write-Error "Apple touch icon is not configured."
            exit 1
          }

          foreach ($branchGuard in @(
            '"audit/consolidated-diagnostic-20261022": false',
            '"audit/adaptive-factory-ai-router-20261024": false',
            '"audit/investment-discovery-decision-20261024": false',
            '"audit/investment-intake-multiselect-diagnostic-20261024": false',
            '"audit/client-diagnostic-questionnaire-20261024": false',
            '"audit/client-diagnostic-short-v2-20261024": false'
          )) {
            if (-not $vercel.Contains($branchGuard)) {
              Write-Error "Audit branch must not trigger a Vercel preview deployment: $branchGuard"
              exit 1
            }
          }

      - name: Validate commercial master, consulting model and offline coverage
        shell: pwsh
        run: |
          $master = Get-Content "./app/(protected)/commercial-master/page.tsx" -Raw
          $sidebar = Get-Content "./components/sidebar.tsx" -Raw
          $admin = Get-Content "./app/(protected)/admin/page.tsx" -Raw
          $monetization = Get-Content "./app/(protected)/monetization/page.tsx" -Raw
          $briefingMonetization = Get-Content "./app/(protected)/monetization/briefing-diario/page.tsx" -Raw
          $deliverables = Get-Content "./app/(protected)/deliverables/page.tsx" -Raw
          $workstreamMigration = Get-Content "../supabase/migrations/20261022154500_deliverable_workstreams.sql" -Raw
          $masterExport = Get-Content "./app/api/exports/commercial-master/route.ts" -Raw
          $offlineBootstrap = Get-Content "./app/api/offline/bootstrap/route.ts" -Raw
          $offlineClient = Get-Content "./lib/offline-client.ts" -Raw
          $offlineApp = Get-Content "./public/offline-app.js" -Raw
          $smoke = Get-Content "../scripts/FULL_SMOKE_POWERSHELL.ps1" -Raw
          $vercel = Get-Content "./vercel.json" -Raw

          foreach ($token in @(
            "O PCC funciona como consultor de projectos",
            "Personalizado · Agregado · Integrado",
            "Pacotes e preços",
            "Custos associados",
            "Base de entregáveis da consultoria",
            "Avaliar",
            "Decidir",
            "Estruturar",
            "Acompanhar",
            "Comprovar valor"
          )) {
            if (-not $master.Contains($token)) {
              Write-Error "Commercial master is missing required content: $token"
              exit 1
            }
          }

          foreach ($token in @("/monetization", "Comercial", "Backlog, pipeline, leads")) {
            if (-not $admin.Contains($token)) {
              Write-Error "Commercial administration navigation is missing: $token"
              exit 1
            }
          }

          if ($admin.Contains('href: "/commercial-master"')) {
            Write-Error "Master Comercial must be a project deliverable, not a separate Administration module."
            exit 1
          }

          foreach ($token in @("/commercial-master", "/monetization")) {
            if ($sidebar.Contains($token)) {
              Write-Error "Commercial area must not appear in primary navigation: $token"
              exit 1
            }
          }

          foreach ($page in @($master, $monetization, $briefingMonetization)) {
            if (-not $page.Contains("requireAdmin")) {
              Write-Error "Commercial routes must require administrator access."
              exit 1
            }
          }

          foreach ($token in @("project_strategy_execution_plans", "project_commercial_profiles", "financial_entries", "commercial_leads")) {
            if (-not $offlineBootstrap.Contains($token)) {
              Write-Error "Offline commercial snapshot is missing source: $token"
              exit 1
            }
          }

          foreach ($token in @("strategyPlans", "commercialProfiles", "financialEntries", "commercialLeads")) {
            if (-not $offlineClient.Contains($token) -and -not $offlineApp.Contains($token)) {
              Write-Error "Offline commercial snapshot support is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("/commercial-master", "/monetization")) {
            if ($offlineClient.Contains($token)) {
              Write-Error "Protected commercial pages must not be cached as offline HTML: $token"
              exit 1
            }
          }

          foreach ($token in @("Backlog comercial", "Pipeline", "Novo entregável comercial", "Entregáveis comerciais")) {
            if (-not $monetization.Contains($token)) {
              Write-Error "Transversal Commercial workspace is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("commercial", "financial", "operational", "governance", "technical")) {
            if (-not $workstreamMigration.Contains($token)) {
              Write-Error "Deliverable workstream taxonomy is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("Vertente do entregável", "Baixar / abrir")) {
            if (-not $deliverables.Contains($token)) {
              Write-Error "Deliverables central archive is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("PCC_Master_Comercial.doc", "application/msword", "Marketing, Vendas e Lançamento do PCC")) {
            if (-not $masterExport.Contains($token)) {
              Write-Error "Master Comercial downloadable deliverable is missing: $token"
              exit 1
            }
          }

          foreach ($token in @("PCC mobile icon 192", "PCC mobile icon 512", "PCC maskable icon", "/commercial-master", "Master Comercial export rejects anonymous access")) {
            if (-not $smoke.Contains($token)) {
              Write-Error "Smoke coverage is missing: $token"
              exit 1
            }
          }

          if (-not $vercel.Contains('"audit/commercial-master-20261022": false')) {
            Write-Error "Commercial audit branch must not trigger a Vercel preview deployment."
            exit 1
          }

      - name: Validate commitment, acceptance and safe closure
        shell: pwsh
        run: |
          $migration = Get-Content "../supabase/migrations/20261023152000_commitment_acceptance_and_safe_closure.sql" -Raw
          $mutations = Get-Content "./app/(protected)/mutations.ts" -Raw
          $project = Get-Content -LiteralPath "./app/(protected)/projects/[id]/page.tsx" -Raw
          $deliverables = Get-Content "./app/(protected)/deliverables/page.tsx" -Raw
          $objectives = Get-Content "./app/(protected)/objectives/page.tsx" -Raw
          $commercial = Get-Content "./app/(protected)/monetization/page.tsx" -Raw
          $vercel = Get-Content "./vercel.json" -Raw
          $offlineBootstrap = Get-Content "./app/api/offline/bootstrap/route.ts" -Raw
          $offlineClient = Get-Content "./lib/offline-client.ts" -Raw
          $serviceWorker = Get-Content "./public/sw.js" -Raw

          foreach ($token in @(
            "project_commitment_baselines",
            "project_change_requests",
            "client_validation_reference",
            "qa_status",
            "acceptance_status",
            "cost_treatment",
            "value_status",
            "handover_status",
            "continuity_status",
            "information_classification",
            "enforce_project_execution_commitment"
          )) {
            if (-not $migration.Contains($token)) {
              Write-Error "Missing PCC commitment/safe-closure database guard: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "saveCommitmentBaseline",
            "approveCommitmentInternally",
            "validateCommitmentByClient",
            "createProjectChangeRequest",
            "recordDeliverableQA",
            "recordDeliverableAcceptance",
            "updateProjectOutcomeStatus"
          )) {
            if (-not $mutations.Contains($token)) {
              Write-Error "Missing PCC commitment workflow action: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "G3 · Compromisso de Entrega",
            "Registar validação e autorizar execução",
            "Alterações de âmbito"
          )) {
            if (-not $project.Contains($token)) {
              Write-Error "Project detail is missing protected commitment UI: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "QA e aceitação",
            "Valor e transferência",
            "Continuidade / recuperação",
            "baseline validada pelo cliente",
            "Regra de fecho:"
          )) {
            if (-not $deliverables.Contains($token)) {
              Write-Error "Deliverables closure UI is missing protected rule: $token"
              exit 1
            }
          }

          if ($objectives.Contains("Cada projecto aprovado deve ter")) {
            Write-Error "Legacy objective explanatory card returned."
            exit 1
          }

          foreach ($token in @("Contacto", "Interesse", "Diagnóstico", "Demonstração", "Proposta", "Cliente", "Handoff")) {
            if (-not $commercial.Contains($token)) {
              Write-Error "Validated commercial pipeline is missing: $token"
              exit 1
            }
          }

          foreach ($token in @(
            "confidential",
            "restricted",
            "allowedProjectIds",
            "safeProjectRows"
          )) {
            if (-not $offlineBootstrap.Contains($token)) {
              Write-Error "Sensitive-project offline filter is missing: $token"
              exit 1
            }
          }

          if (-not $serviceWorker.Contains('if (event.request.mode === "navigate")') -or -not $serviceWorker.Contains("fetch(event.request).catch(async () => {")) {
            Write-Error "Protected navigations must fall back to the offline shell without persisting authenticated HTML."
            exit 1
          }

          if (-not $offlineClient.Contains("caches.delete(OFFLINE_ROUTE_CACHE)")) {
            Write-Error "Logout/offline cleanup must remove the protected route cache."
            exit 1
          }

          if (-not $vercel.Contains('"audit/pcc-final-consolidation-20261023": false')) {
            Write-Error "Final consolidation branch must not trigger a Vercel preview deployment."
            exit 1
          }

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build
