<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Sem ligação · Project Command Center</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f8fafc; color: #0f172a; font-family: Arial, sans-serif; }
      main { width: min(100%, 430px); border: 1px solid #e2e8f0; border-radius: 24px; padding: 32px; background: white; box-shadow: 0 18px 45px rgba(15, 23, 42, .08); }
      small { color: #2563eb; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 12px 0 10px; font-size: 28px; }
      p { margin: 0; color: #475569; line-height: 1.6; }
      button { width: 100%; min-height: 48px; margin-top: 24px; border: 0; border-radius: 12px; background: #0f172a; color: white; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <small>Project Command Center</small>
      <h1>Sem ligação à internet</h1>
      <p>Os seus dados continuam protegidos. Volte a tentar quando recuperar a ligação.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
