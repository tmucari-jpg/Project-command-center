<!doctype html>
<html lang="pt-MZ">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#073f36" />
  <title>Modo offline · Project Command Center</title>
  <style>
    :root{--bg:#f8f6f0;--surface:#fff;--muted:#667085;--fg:#142825;--border:#e0e8e3;--accent:#073f36;--gold:#c99439;--success:#2e7d5b;--blocked:#b42318;--blocked-soft:#fee4e2;--overdue:#d97706;--overdue-soft:#fff3e6;--due:#c99439;--due-soft:#fbf3e4;--progress:#0f766e;--progress-soft:#e6f4f1}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 92% 3%,rgba(201,148,57,.10),transparent 24rem),var(--bg);color:var(--fg);font:14px/1.5 Inter,Arial,sans-serif}
    button,input,textarea,select{font:inherit}.shell{width:min(100% - 24px,1180px);margin:auto;padding:18px 0 80px}.top{position:sticky;top:0;z-index:20;margin:-18px -12px 0;padding:14px 12px;background:rgba(248,246,240,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
    .topline{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand img{width:38px;height:38px;border-radius:11px}.brand strong{display:block;font-size:14px}.brand small{color:var(--gold);font-weight:700;text-transform:uppercase;letter-spacing:.08em}
    .pill{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:999px;padding:6px 10px;background:#fff;font-size:11px;font-weight:700}.offline{color:var(--overdue)}.online{color:var(--success)}
    .nav{display:flex;gap:7px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}.nav::-webkit-scrollbar{display:none}.nav button{white-space:nowrap;border:1px solid var(--border);border-radius:999px;background:#fff;color:var(--fg);padding:8px 11px;font-weight:700}.nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}.toolbar input{flex:1;min-width:180px}.field,input,textarea,select{width:100%;border:1px solid var(--border);border-radius:12px;background:#fff;padding:10px 11px;color:var(--fg)}textarea{min-height:86px;resize:vertical}
    .grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}@media(min-width:760px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:1fr 1fr}}
    .card{border:1px solid var(--border);border-radius:18px;background:rgba(255,255,255,.95);padding:16px;box-shadow:0 8px 28px rgba(7,63,54,.05)}.card h2,.card h3{margin:0}.metric{font-size:28px;font-weight:800;margin-top:6px}.muted{color:var(--muted)}.small{font-size:12px}.section{margin-top:18px}.list{display:grid;gap:9px}.item{border:1px solid var(--border);border-radius:14px;background:#fff;padding:13px}.itemtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.item h3{font-size:14px;margin:0}.meta{margin-top:5px;color:var(--muted);font-size:12px}.tag{display:inline-flex;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800;background:#f3f6f4;color:var(--muted)}
    .tag.blocked{background:var(--blocked-soft);color:var(--blocked)}.tag.overdue{background:var(--overdue-soft);color:var(--overdue)}.tag.progress{background:var(--progress-soft);color:var(--progress)}.tag.success{background:#e8f3ef;color:var(--success)}.tag.due{background:var(--due-soft);color:#8a611c}
    .bar{height:10px;border-radius:999px;overflow:hidden;background:#f3f6f4}.bar span{display:block;height:100%;background:var(--accent);border-radius:999px}.donut{width:128px;height:128px;border-radius:50%;position:relative}.donut:after{content:"";position:absolute;inset:25%;border-radius:50%;background:#fff}.donutvalue{position:absolute;inset:0;z-index:1;display:grid;place-items:center;font-weight:800;font-size:22px}
    .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.button{border:0;border-radius:12px;padding:10px 12px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer}.button.secondary{border:1px solid var(--border);background:#fff;color:var(--accent)}.button.small{padding:6px 9px;font-size:11px}
    .notice{border-left:3px solid var(--gold);padding:10px 12px;background:#fff8e9;border-radius:0 12px 12px 0}.error{color:var(--blocked)}.ok{color:var(--success)}.hidden{display:none!important}
    dialog{width:min(94vw,680px);border:1px solid var(--border);border-radius:20px;padding:0;box-shadow:0 30px 80px rgba(0,0,0,.18)}dialog::backdrop{background:rgba(20,40,37,.34)}.dialogbody{padding:18px}.formgrid{display:grid;gap:12px}@media(min-width:640px){.formgrid.two{grid-template-columns:1fr 1fr}}label{font-weight:700;font-size:12px}.empty{padding:28px 12px;text-align:center;color:var(--muted)}
  </style>
</head>
<body>
  <main class="shell">
    <div class="top">
      <div class="topline">
        <div class="brand">
          <img src="/icons/icon-192.png" alt="PCC" />
          <div><strong>Project Command Center</strong><small>Modo offline completo</small></div>
        </div>
        <span id="network" class="pill offline">Offline</span>
      </div>
      <div id="nav" class="nav"></div>
    </div>

    <section id="locked" class="card section hidden">
      <h2>Acesso offline ainda não activado</h2>
      <p class="muted">Este dispositivo precisa de uma sessão online pelo menos uma vez para guardar o workspace do PCC com segurança.</p>
      <button class="button secondary" onclick="location.href='/auth/login'">Entrar quando houver internet</button>
    </section>

    <section id="workspace" class="hidden">
      <div class="toolbar">
        <input id="search" class="field" placeholder="Pesquisar no PCC offline..." />
        <span id="queueCount" class="pill">0 por sincronizar</span>
        <button id="captureButton" class="button">Registar trabalho</button>
        <button id="syncButton" class="button secondary">Sincronizar</button>
      </div>
      <p id="message" class="small muted"></p>
      <div id="content" class="section"></div>
    </section>
  </main>

  <dialog id="captureDialog">
    <div class="dialogbody">
      <div class="itemtop"><div><h2>Registar trabalho offline</h2><p class="small muted">Fica no dispositivo até a ligação voltar.</p></div><button id="closeDialog" class="button secondary small">Fechar</button></div>
      <div class="formgrid two" style="margin-top:14px">
        <label>Tipo
          <select id="captureType">
            <option value="create_action">Nova acção</option>
            <option value="create_idea">Nova ideia</option>
            <option value="create_evidence">Nova evidência</option>
            <option value="create_blocker">Novo bloqueio</option>
            <option value="create_factory_intake">Novo projecto para avaliação</option>
          </select>
        </label>
        <label id="projectField">Projecto<select id="captureProject"></select></label>
        <label id="actionField" class="hidden">Acção<select id="captureAction"></select></label>
        <label id="deliverableField">Entregável<select id="captureDeliverable"></select></label>
      </div>
      <div class="formgrid" style="margin-top:12px">
        <label>Título<input id="captureTitle" maxlength="180" /></label>
        <label id="problemField" class="hidden">Problema / oportunidade<textarea id="captureProblem"></textarea></label>
        <label>Descrição<textarea id="captureDescription"></textarea></label>
        <label id="expectedField" class="hidden">Resultado esperado<textarea id="captureExpected"></textarea></label>
      </div>
      <div class="row" style="margin-top:14px"><button id="saveCapture" class="button">Guardar no dispositivo</button></div>
    </div>
  </dialog>

  <script src="/offline-app.js"></script>
</body>
</html>
